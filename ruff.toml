target-version = "py310"
line-length = 120

[lint]
select = ["ALL"]
ignore = [
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", # Optional annotations for small helpers.
    "COM812", # Let the formatter handle trailing commas.
    "CPY001", # The repository includes its license separately.
    "D401",   # Allow descriptive docstrings.
]

[lint.pydocstyle]
convention = "numpy"
